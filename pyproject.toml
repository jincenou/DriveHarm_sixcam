[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "driveharm-sixcam"
version = "0.1.0"
description = "Audited six-camera STORM asset re-insertion pair production"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=10", "openai>=2.0"]

[project.scripts]
driveharm = "driveharm.cli:main"
driveharm-sixcam = "driveharm.cli:main"
driveharm-storm-renderer = "driveharm.storm_adapter:main"
driveharm-storm-baseline = "driveharm.storm_baseline:main"
driveharm-sixcam-production = "driveharm.sixcam_production:main"

[tool.setuptools]
packages = ["driveharm"]
